{{- if .Values.daemonset.enabled }}
{{- /* daemonset.ebpf and daemonset.obi arrived in chart 1.20. An upgrade
with --reuse-values keeps the values of the chart it was installed
from, where they do not exist: read them through empty-map defaults so
such upgrades render, with eBPF and OBI off (no new privileges until
they are turned on, e.g. with --reset-then-reuse-values). */}}
{{- $ebpf := .Values.daemonset.ebpf | default dict }}
{{- $obi := .Values.daemonset.obi | default dict }}
# Per-node host-metrics workload (Phase 2.1).
#
# Runs the same agent image as the central StatefulSet but with
# LIGHTHOUSE_ROLE=host_metrics — the check scheduler and Ingress
# discovery watcher are skipped (the central pod owns those), leaving
# just the registration + heartbeat + host-metrics ticker. Each pod
# reads the node's /proc through a hostPath mount (LIGHTHOUSE_PROC_ROOT
# = /host/proc) so cpu / mem / disk / net metrics reflect the node
# rather than the container's pid namespace.
#
# All pods share the same Secret-mounted token. The Console flips the
# bound Lighthouse to allow_multi_instance=true on the first
# registration of a k8s agent (sticky-update from migration 131), so
# N pods sharing one token don't 409 each other and each one shows up
# as a separate row in lighthouse_active_agents keyed by node_name.
#
# Pod Security Admission caveat: the hostPath mounts below are forbidden
# under the `restricted` PSA profile. Customers either label the
# namespace `baseline` / `privileged` or supply a custom
# SecurityContext via daemonset.podSecurityContext / extraVolumes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "lighthouse.fullname" . }}-node
  labels:
    {{- include "lighthouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      {{- include "lighthouse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node-agent
  template:
    metadata:
      labels:
        {{- include "lighthouse.labels" . | nindent 8 }}
        app.kubernetes.io/component: node-agent
        {{- with .Values.daemonset.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.daemonset.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # 60s default — same rationale as the StatefulSet template:
      # the agent's shutdown drain (in-flight checks, event buffer
      # flush, /shutdown POST) needs more than k8s's default 30s
      # SIGKILL window. DaemonSet pods drain faster than the
      # central StatefulSet (no discovery snapshot to wait on, no
      # check scheduler running) but they still hit the same /proc
      # collector tick + buffer flush path.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "lighthouse.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # hostPID lets the agent see the node's process tree if the
      # collector ever needs it; for the current /proc snapshot
      # collector we only need the hostPath mount, but flipping
      # hostPID off here without a values-knob would be a breaking
      # change later.
      # eBPF needs the host PID namespace: the kernel reports host pids.
      hostPID: {{ or .Values.daemonset.hostPID $ebpf.enabled | default false }}
      {{- with .Values.daemonset.podSecurityContext | default .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lighthouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-config"
            - "/etc/lighthouse/lighthouse.yaml"
          env:
            - name: LIGHTHOUSE_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- $secret := include "lighthouse.tokenSecret" . | fromYaml }}
                  name: {{ $secret.name }}
                  key: {{ $secret.key }}
            - name: LIGHTHOUSE_ROLE
              value: "host_metrics"
            - name: LIGHTHOUSE_PROC_ROOT
              value: "/host/proc"
            {{- if .Values.daemonset.mountHostRoot }}
            - name: LIGHTHOUSE_HOST_ROOT
              value: "/host/root"
            {{- end }}
            # NODE_NAME drives lighthouse_active_agents row identity on
            # the Console — must match how the central StatefulSet's
            # heartbeat reports its node. Sourced from the downward API
            # so we get the actual scheduling node, not pod hostname.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The node's address, reported in host facts so the Console
            # can resolve dependency edges to this host.
            - name: LIGHTHOUSE_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- if and $ebpf.enabled $obi.enabled }}
            - name: LIGHTHOUSE_OBI_METRICS_URL
              value: "http://127.0.0.1:{{ $obi.port }}/metrics"
            {{- end }}
            {{- if not $ebpf.enabled }}
            # Local eBPF kill switch: nothing is loaded, whatever the
            # Console's remote flags say.
            - name: LIGHTHOUSE_EBPF
              value: "off"
            {{- end }}
            {{- with .Values.daemonset.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.healthz.enabled }}
          ports:
            - name: healthz
              containerPort: {{ .Values.healthz.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: healthz
            {{- toYaml .Values.healthz.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: healthz
            {{- toYaml .Values.healthz.readinessProbe | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/lighthouse
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/lighthouse
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            {{- if .Values.daemonset.mountHostSys }}
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            {{- end }}
            {{- if .Values.daemonset.mountHostRoot }}
            - name: host-root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
            {{- end }}
          resources:
            {{- toYaml (.Values.daemonset.resources | default .Values.resources) | nindent 12 }}
          {{- $csc := deepCopy (.Values.daemonset.containerSecurityContext | default .Values.containerSecurityContext | default dict) }}
          {{- if $ebpf.enabled }}
          {{- $caps := deepCopy (get $csc "capabilities" | default dict) }}
          {{- $_ := set $caps "add" $ebpf.capabilities }}
          {{- $_ := set $csc "capabilities" $caps }}
          {{- end }}
          {{- with $csc }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if and $ebpf.enabled $obi.enabled }}
        # Passive request metrics (docs/eBPF/06): OpenTelemetry eBPF
        # Instrumentation as its own container with its own privileges, so
        # a crash or CPU spike stays out of the agent. It shares the pod's
        # network namespace; the agent reads its Prometheus endpoint on
        # loopback (LIGHTHOUSE_OBI_METRICS_URL above).
        - name: obi
          image: "{{ $obi.image.repository }}:{{ $obi.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: OTEL_EBPF_PROMETHEUS_PORT
              value: {{ $obi.port | quote }}
            - name: OTEL_EBPF_OPEN_PORT
              value: {{ $obi.openPorts | quote }}
            - name: OTEL_EBPF_LOG_LEVEL
              value: WARN
            # The agent maps OBI's instance label (host:pid) to pods
            # itself; OBI's own decorator would need cluster-wide watch
            # on pods and nodes.
            - name: OTEL_EBPF_KUBE_METADATA_ENABLE
              value: "false"
            # Read-only: OBI never writes trace context into traffic
            # (status-harbor docs/eBPF/11-traces.md); this also keeps its
            # TC programs off Cilium clusters.
            - name: OTEL_EBPF_BPF_CONTEXT_PROPAGATION
              value: disabled
            {{- if $obi.traces }}
            # Spans go to the agent's receiver on the pod's loopback, which
            # filters and samples them and drops them while Traces is off
            # in the Console.
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://127.0.0.1:19401/v1/traces
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: http/protobuf
            {{- end }}
          resources:
            {{- toYaml $obi.resources | nindent 12 }}
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add:
                {{- toYaml $obi.capabilities | nindent 16 }}
        {{- end }}
      volumes:
        # DaemonSet pods are ephemeral — emptyDir for the data dir is
        # fine. The instance.id file regenerates on each pod start,
        # which is exactly what we want for the per-node ledger.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ printf "%s-config" (include "lighthouse.fullname" .) }}
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        {{- if .Values.daemonset.mountHostSys }}
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        {{- end }}
        {{- if .Values.daemonset.mountHostRoot }}
        # mountPropagation: HostToContainer on the volumeMount above so
        # any sub-mounts on the host (e.g. /var/lib/docker as a separate
        # filesystem) propagate into /host/root inside the pod —
        # otherwise statfs() inside the bind-mount only sees the root
        # filesystem and silently skips every sub-mount.
        - name: host-root
          hostPath:
            path: /
            type: Directory
        {{- end }}
      {{- with .Values.daemonset.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
