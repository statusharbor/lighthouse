# Lighthouse agent configuration.
#
# `token` is the only required field — minted in the Status Harbor Console
# when you click "+ New Lighthouse" and shown only once.
#
# The Console URL is hardcoded to https://lighthouse.statusharbor.io and
# is not configurable. The agent never persists or transmits its
# lighthouse_id; the server resolves it from the token.
token: lh_REPLACE_ME

# Optional. Defaults shown.
agent:
  data_dir: /var/lib/lighthouse
  max_concurrent_checks: 10
  log_level: info        # info | debug
  # eBPF collectors (Linux) start only when enabled for this Lighthouse in
  # the Console. "off" is the local kill switch: nothing is loaded,
  # whatever the Console says. Same as LIGHTHOUSE_EBPF=off.
  # ebpf: off
  # Passive request metrics: an OpenTelemetry eBPF Instrumentation binary
  # for the agent to start and supervise (docs: README "eBPF collectors").
  # obi:
  #   path: /usr/local/bin/obi
  #   ports: "80,443,8000-8999"

  # Database monitoring (docs/databases/plan.md in status-harbor) is
  # configured entirely in the Console UI - node DSNs are entered there,
  # stored encrypted, and delivered to this agent via the gate. There is
  # nothing to configure here.
